<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date</title>
    <link rel="stylesheet" href="css/date.css" />
  </head>

  <body>
    <h1 title="choose a date">So when are you free...</h1>

    <form class="form-group">
      <div>
        <input type="date" placeholder="Select the day">
 

        <select>
          <option selected disabled>Select a time...</option>
          <option>5:00 PM — we eating with the stars</option>
          <option>6:00 PM — this is the right answer😌</option>
          <option>7:00 PM — you're making me hungry already</option>
          <option>8:00 PM — dinner or breakfast at this point?</option>
        </select>

        <button
          class="button"
          type="submit"
          formaction="food.html"
        >
          Set the date🤭
        </button>
      </div>
    </form>
  </body>
</html>
