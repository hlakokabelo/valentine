<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Blooming Love · Can't Wait to See You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      text-align: center;
      margin: 0;
      min-height: 100vh;
      font-family: 'Courier New', 'Courier', monospace;
      background: linear-gradient(145deg, #fff5e4 0%, #ffe8da 100%);
      color: #ff9494;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* main container — soft card effect */
    .container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      background: rgba(255, 245, 228, 0.75);
      backdrop-filter: blur(2px);
      border-radius: 68px;
      padding: 2rem 1.5rem 2.8rem 1.5rem;
      box-shadow: 0 20px 35px rgba(255, 148, 148, 0.2), 0 8px 12px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
    }

    #thankyou {
      font-size: clamp(28px, 6vw, 52px);
      margin-bottom: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ff8e8e, #ffb6b6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 2px 2px 12px rgba(255, 180, 180, 0.3);
      line-height: 1.3;
      padding: 0 8px;
    }

    /* flower zone */
    .flower {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 28px;
      margin: 35px 0 30px;
      min-height: 280px;
    }

    /* each flower wrapper */
    .f-wrapper {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .f-wrapper:hover {
      transform: translateY(-8px) scale(1.02);
    }

    /* flower stem + line */
    .flower__line {
      width: 4px;
      height: 55px;
      background: linear-gradient(180deg, #7eb87e, #5b8c5a);
      border-radius: 4px;
      margin-top: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    /* flower head container */
    .f {
      position: relative;
      width: 70px;
      height: 70px;
      animation: softFloat 3s infinite ease-in-out;
    }

    /* all petals base */
    .flower__leaf {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #ffb7b7;
      border-radius: 70% 30% 60% 40% / 45% 45% 55% 55%;
      transform-origin: center;
      box-shadow: 0 4px 10px rgba(255, 120, 120, 0.25);
      transition: all 0.2s;
    }

    /* petal variations & positions */
    .flower__leaf--1 { top: -10px; left: 19px; background: #ff9f9f; transform: rotate(0deg); }
    .flower__leaf--2 { top: 2px; left: 44px; background: #ffadad; transform: rotate(50deg); }
    .flower__leaf--3 { top: 24px; left: 49px; background: #ffbbbb; transform: rotate(100deg); }
    .flower__leaf--4 { top: 44px; left: 32px; background: #ffc4c4; transform: rotate(150deg); }
    .flower__leaf--5 { top: 44px; left: 8px; background: #ffabab; transform: rotate(200deg); }
    .flower__leaf--6 { top: 24px; left: -4px; background: #ffb0b0; transform: rotate(250deg); }
    .flower__leaf--7 { top: 2px; left: -2px; background: #ffa3a3; transform: rotate(310deg); }
    .flower__leaf--8 {
      top: 18px;
      left: 18px;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #fff0c0, #ffe0a3);
      border-radius: 50%;
      transform: rotate(0deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* falling petal colors */
    .flower__fall-down--yellow { background: #ffe2a4 !important; box-shadow: 0 2px 5px #ffcd94; }
    .flower__fall-down--pink { background: #ffbcd6 !important; }
    .flower__fall-down--purple { background: #e0bbff !important; }

    /* glass effect at bottom (tiny vase) */
    .flower__glass {
      width: 48px;
      height: 38px;
      background: radial-gradient(ellipse at 30% 20%, rgba(255,255,245,0.6), rgba(235,210,195,0.5));
      border-radius: 0 0 30px 30px;
      margin-top: -12px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,220,200,0.7);
      box-shadow: inset 0 2px 4px rgba(255,255,210,0.8), 0 4px 8px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    /* individual wrapper adjustments for variety */
    .f-wrapper--2 .flower__leaf--8 { background: radial-gradient(circle, #ffcfdf, #ffb0cc); }
    .f-wrapper--3 .flower__leaf--8 { background: radial-gradient(circle, #e6d0ff, #dbb5ff); }
    .f-wrapper--2 .f { animation-delay: 0.4s; }
    .f-wrapper--3 .f { animation-delay: 0.7s; }

    @keyframes softFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* rizz / romantic message bar */
    .rizz {
      background: #fff0e8;
      padding: 14px 18px;
      margin: 20px 0 18px;
      border-radius: 60px;
      display: inline-block;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e67e7e;
      border-left: 4px solid #ffb9b9;
      border-right: 4px solid #ffb9b9;
      box-shadow: 0 2px 8px rgba(255, 148, 148, 0.2);
      backdrop-filter: blur(2px);
      transition: 0.2s;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.3px;
    }

    .rizz span {
      display: inline-block;
      animation: gentleWink 1.5s infinite;
    }

    @keyframes gentleWink {
      0% { opacity: 0.5; transform: scale(0.95);}
      50% { opacity: 1; transform: scale(1.05);}
      100% { opacity: 0.5; transform: scale(0.95);}
    }

    /* button group */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 18px;
    }

    .button {
      padding: 12px 26px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Courier New', 'Courier', monospace;
      background-color: #ffe3e1;
      color: #e67373;
      border-radius: 60px;
      border: 2px solid #ffd1cf;
      box-shadow: 0 4px 8px rgba(255, 148, 148, 0.25);
      transition: all 0.25s ease;
      backdrop-filter: blur(2px);
      letter-spacing: 0.5px;
    }

    .button:hover {
      background-color: #ff9494;
      color: #fff5e4;
      border: 2px solid #ffb7b7;
      transform: translateY(-3px);
      box-shadow: 0 12px 18px rgba(255, 120, 120, 0.35);
    }

    .button:active {
      transform: translateY(1px);
      transition: 0.05s;
    }

    /* secret surprise panel */
    .surprise-message {
      margin-top: 28px;
      background: rgba(255, 240, 230, 0.8);
      border-radius: 48px;
      padding: 10px 18px;
      font-size: 0.95rem;
      color: #e77d7d;
      font-weight: bold;
      backdrop-filter: blur(4px);
      transition: 0.2s;
      border: 1px solid #ffcfc2;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    /* responsive adjustments */
    @media (max-width: 520px) {
      .container {
        padding: 1.5rem 1rem 2rem;
      }
      .flower {
        gap: 12px;
      }
      .f {
        width: 60px;
        height: 60px;
      }
      .flower__leaf {
        width: 26px;
        height: 26px;
      }
      .flower__leaf--8 {
        width: 24px;
        height: 24px;
        top: 16px;
        left: 16px;
      }
      .flower__line {
        height: 40px;
      }
      .button {
        padding: 8px 20px;
        font-size: 0.9rem;
      }
      .rizz {
        font-size: 0.9rem;
        padding: 10px 14px;
      }
      #thankyou {
        margin-bottom: 16px;
      }
    }

    /* hidden counter effect */
    .hidden-countdown {
      font-size: 0.8rem;
      margin-top: 12px;
      color: #ffb2b2;
      background: rgba(255,245,230,0.7);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 60px;
      font-weight: normal;
    }

    footer {
      font-size: 0.7rem;
      margin-top: 22px;
      color: #ffbcbc;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- main romantic headline -->
  <div id="thankyou">
    ✨ I can’t wait to see you🥺🤭… <br> feels like time’s dragging its feet on purpose 🕰️💫💔
  </div>

  <!-- three animated flowers with different personalities -->
  <div class="flower">
    <div class="f-wrapper">
      <div class="f">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__leaf flower__leaf--5"></div>
        <div class="flower__leaf flower__leaf--6"></div>
        <div class="flower__leaf flower__leaf--7"></div>
        <div class="flower__leaf flower__leaf--8 flower__fall-down--yellow"></div>
      </div>
      <div class="flower__line"></div>
      <div class="flower__glass"></div>
    </div>

    <div class="f-wrapper f-wrapper--2">
      <div class="f">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__leaf flower__leaf--5"></div>
        <div class="flower__leaf flower__leaf--6"></div>
        <div class="flower__leaf flower__leaf--7"></div>
        <div class="flower__leaf flower__leaf--8 flower__fall-down--pink"></div>
      </div>
      <div class="flower__line"></div>
      <div class="flower__glass"></div>
    </div>

    <div class="f-wrapper f-wrapper--3">
      <div class="f">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__leaf flower__leaf--5"></div>
        <div class="flower__leaf flower__leaf--6"></div>
        <div class="flower__leaf flower__leaf--7"></div>
        <div class="flower__leaf flower__leaf--8 flower__fall-down--purple"></div>
      </div>
      <div class="flower__line"></div>
      <div class="flower__glass"></div>
    </div>
  </div>

  <!-- charming rizz line -->
  <div class="rizz">
    🌸 every petal whispers your name · counting every second till your smile 🌸
    <span>✨</span>
  </div>

  <!-- interactive buttons for playful charm -->
  <div class="button-group">
    <button class="button" id="loveNoteBtn">💌 send a heartbeat</button>
    <button class="button" id="countdownBtn">⏳ time warp 💫</button>
    <button class="button" id="surpriseBtn">🌹 drop a surprise</button>
  </div>

  <!-- dynamic area for additional messages -->
  <div id="dynamicMessage" class="surprise-message" style="display: none;">
    💖 * whisper of affection * 💖
  </div>

  <!-- countdown indicator (fun) -->
  <div id="countdownDisplay" class="hidden-countdown"></div>
  <footer>🌸 pressing flowers & hearts until we meet 🌸</footer>
</div>

<script>
  (function() {
    // DOM elements
    const loveBtn = document.getElementById('loveNoteBtn');
    const countdownBtn = document.getElementById('countdownBtn');
    const surpriseBtn = document.getElementById('surpriseBtn');
    const dynamicDiv = document.getElementById('dynamicMessage');
    const countdownDisplay = document.getElementById('countdownDisplay');
    
    // random romantic messages pool
    const loveMessages = [
      "💓 my heart does a little dance every time i think of you 💓",
      "✨ your laugh is my favorite melody — hurry up, universe! ✨",
      "🌙 i’ve saved you a spot in my dreams until we meet again 🌙",
      "🍬 you’re the sweetness i’ve been craving — time, be swift! 🍬",
      "💌 every hour feels like a year… but you’re worth every second 💌",
      "🌸 being away from you feels like winter without snow — incomplete 🌸",
      "⭐ i already picked the perfect spot for our hug ⭐",
      "🍂 counting down the milliseconds like a lovesick poet 🍂"
    ];
    
    const surpriseMessages = [
      "🎁 surprise! i’ve been practicing my best ‘welcome back’ hug 🤗",
      "💞 plot twist: i’ve already picked the song that reminds me of us 💞",
      "🌟 a little secret: i wrote your name in the clouds today 🌟",
      "🍫 chocolate tastes better when i imagine sharing it with you 🍫",
      "🎈 boom! a tiny firework of affection just for you 💥",
      "📖 our story is my favorite chapter — and we’re just getting started 📖"
    ];
    
    // random message helper
    function getRandomMessage(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }
    
    // show dynamic message with fade effect
    let timeoutId = null;
    function showTempMessage(message, isPermanent = false) {
      if (timeoutId) clearTimeout(timeoutId);
      dynamicDiv.style.display = "block";
      dynamicDiv.style.opacity = "0";
      dynamicDiv.innerHTML = `💌 ${message} 💌`;
      dynamicDiv.style.transition = "opacity 0.2s";
      dynamicDiv.style.opacity = "1";
      
      if (!isPermanent) {
        timeoutId = setTimeout(() => {
          dynamicDiv.style.opacity = "0";
          setTimeout(() => {
            if (dynamicDiv.style.opacity === "0") {
              dynamicDiv.style.display = "none";
            }
          }, 200);
        }, 3200);
      } else {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = null;
      }
    }
    
    // countdown target: set a whimsical future date (3 days from now)
    let targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 3);
    targetDate.setHours(20, 0, 0, 0); // 8:00 PM romantic meeting hour
    
    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;
      
      if (diff <= 0) {
        countdownDisplay.innerHTML = "🎉 IT'S TIME! Almost there? or wait... you're already HERE in my heart 🎉";
        countdownDisplay.style.fontSize = "0.85rem";
        countdownDisplay.style.background = "#ffe0d4";
        return;
      }
      
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (86400000)) / (3600000));
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);
      
      let countText = `⏰ countdown to 'see you soon' magic — `;
      if (days > 0) countText += `${days}d `;
      countText += `${hours}h ${minutes}m ${seconds}s`;
      countdownDisplay.innerHTML = `🌸 ${countText} 🌸`;
    }
    
    // manual countdown refresh every second
    let countdownInterval = null;
    function startCountdownUpdater() {
      if (countdownInterval) clearInterval(countdownInterval);
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    }
    
    // event: love note button
    loveBtn.addEventListener('click', () => {
      const msg = getRandomMessage(loveMessages);
      showTempMessage(msg, false);
      // micro animation on flowers: make them bounce a little
      const wrappers = document.querySelectorAll('.f-wrapper');
      wrappers.forEach((wrap, idx) => {
        wrap.style.transform = "translateY(-5px) scale(1.01)";
        setTimeout(() => {
          wrap.style.transform = "";
        }, 200);
      });
    });
    
    // event: countdown button triggers special message + updates countdown fresh
    countdownBtn.addEventListener('click', () => {
      showTempMessage("✨ time is bending just to bring us closer ✨ ... check the clockwork below!", false);
      // re-sync countdown: make sure target is still romantic
      if (!countdownInterval) startCountdownUpdater();
      else updateCountdown();
      // small playful pulse on countdown display
      countdownDisplay.style.transform = "scale(1.02)";
      setTimeout(() => { countdownDisplay.style.transform = ""; }, 300);
    });
    
    // event: surprise button shows something extra and a gentle flower rain effect? subtle
    surpriseBtn.addEventListener('click', () => {
      const surpriseMsg = getRandomMessage(surpriseMessages);
      showTempMessage(`🎀 ${surpriseMsg} 🎀`, false);
      // bonus: change a petal color for fun temporarily (tiny visual treat)
      const allPetals = document.querySelectorAll('.flower__leaf--8');
      allPetals.forEach(petal => {
        const originalBg = getComputedStyle(petal).background;
        petal.style.transition = "background 0.2s";
        petal.style.background = "radial-gradient(circle, #ffd966, #ffc285)";
        setTimeout(() => {
          if (petal.classList.contains('flower__fall-down--yellow')) petal.style.background = "radial-gradient(circle, #fff0c0, #ffe0a3)";
          else if (petal.classList.contains('flower__fall-down--pink')) petal.style.background = "radial-gradient(circle, #ffcfdf, #ffb0cc)";
          else if (petal.classList.contains('flower__fall-down--purple')) petal.style.background = "radial-gradient(circle, #e6d0ff, #dbb5ff)";
          else petal.style.background = "";
        }, 400);
      });
    });
    
    // also initialize with a gentle welcome message after load (delayed a bit)
    window.addEventListener('load', () => {
      startCountdownUpdater();
      setTimeout(() => {
        dynamicDiv.style.display = "block";
        dynamicDiv.style.opacity = "1";
        dynamicDiv.innerHTML = "💖 every flower here blooms for you — counting down to your smile 💖";
        setTimeout(() => {
          dynamicDiv.style.opacity = "0";
          setTimeout(() => {
            if (dynamicDiv.style.opacity === "0") dynamicDiv.style.display = "none";
          }, 400);
        }, 3500);
      }, 600);
    });
    
    // optional: add hover effect to make flowers interactive
    const fWrappers = document.querySelectorAll('.f-wrapper');
    fWrappers.forEach(wrapper => {
      wrapper.addEventListener('mouseenter', () => {
        const fDiv = wrapper.querySelector('.f');
        if (fDiv) fDiv.style.animation = "softFloat 0.8s infinite ease-in-out";
      });
      wrapper.addEventListener('mouseleave', () => {
        const fDiv = wrapper.querySelector('.f');
        if (fDiv) fDiv.style.animation = "softFloat 3s infinite ease-in-out";
      });
    });
    
    // for better container height experience, no extra style issues, clean footer
    // fix any margin/padding side effects
    const containerDiv = document.querySelector('.container');
    if(containerDiv) {
      // just ensure it's centered
    }
  })();
</script>
</body>
</html>
